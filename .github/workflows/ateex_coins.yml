name: Ateex-Coins
on:
  workflow_dispatch:
  schedule:
    # 示例：每30分钟运行一次
    - cron: '*/30 * * * *'

jobs:
  run_ateex_coins:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/ateex_coins.py ateex_coins.py

      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🐍 安装 Python 依赖
        run: |
          pip install requests[socks]

      # --- 核心修改：合并代理启动与脚本运行 ---
      - name: 🚀 启动代理并运行脚本
        env:
          PYTHONIOENCODING: utf-8
          ATEEX_ACCOUNT: ${{ secrets.ATEEX_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          CRON_JOB: ${{ secrets.CRON_JOB }}
          VLESS_CONFIG: ${{ secrets.VLESS_CONFIG }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }} # 别忘了注入 Token
        run: |
          # 如果配置了代理，则启动并运行
          if [ -n "$VLESS_CONFIG" ]; then
            echo "📦 下载 Xray-core..."
            wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -q Xray-linux-64.zip
            chmod +x xray

            echo "📝 写入内核配置文件..."
            echo "$VLESS_CONFIG" > config.json

            echo "🚀 启动 Xray 核心守护进程..."
            nohup ./xray -c config.json > xray.log 2>&1 &
            sleep 5

            echo "🌐 测试代理连通性..."
            if curl -s --max-time 12 -x socks5://127.0.0.1:1080 https://api.ipify.org > ip_res.txt; then
              echo "✅ 代理网络已打通！出口 IP 为："
              cat ip_res.txt | sed 's/\([0-9]*\)\..*/\1.*.*.*/'
            else
              echo "❌ 代理连接失败！"
              cat xray.log
              exit 1
            fi
          else
            echo "ℹ️ 未配置 VLESS_CONFIG，将直连运行。"
          fi

          echo "🚀 开始运行 Ateex 脚本..."
          python ateex_coins.py

      - name: 🗑️ 删除旧运行记录（只保留最近5个）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ 清理旧运行记录，只保留最近 5 个..."
          # 安装 GitHub CLI
          which gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y)

          # 获取并删除旧的运行记录
          run_ids=$(gh run list --workflow "Ateex-Coins" --json databaseId --jq '.[].databaseId' | tail -n +6)
          if [ -z "$run_ids" ]; then
            echo "ℹ️ 无需清理，记录不足 5 个"
            exit 0
          fi
          for id in $run_ids; do
            echo "删除运行记录: $id"
            gh run delete $id --yes || true
          done
          echo "✅ 清理完成"
