name: Ateex-Coins
on:
  workflow_dispatch:
    
jobs:
  run_ateex_coins:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: gunqio/zhiyong
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 复制脚本到工作目录
        run: cp private/ateex_coins.py ateex_coins.py
        
      - name: 🐍 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 🛡️ 启动 Xray 代理（自适应 VLESS/VMess）
        env:
          VLESS_CONFIG: ${{ secrets.VLESS_CONFIG }}
        if: env.VLESS_CONFIG != ''
        run: |
          echo "📦 下载 Xray-core..."
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip
          chmod +x xray

          echo "📝 写入内核配置文件..."
          echo "$VLESS_CONFIG" > config.json

          echo "🚀 启动 Xray 核心守护进程（监听 127.0.0.1:1080）..."
          nohup ./xray -c config.json > xray.log 2>&1 &
          sleep 5

          echo "🌐 测试代理连通性..."
          if curl -s --max-time 12 -x socks5://127.0.0.1:1080 https://api.ipify.org > ip_res.txt; then
            echo "✅ 代理网路已打通！出口 IP 掩码处理为："
            cat ip_res.txt | sed 's/\([0-9]*\)\..*/\1.*.*.*/'
          else
            echo "❌ 代理连接失败或发生握手超时！"
            echo "📄 正在输出 xray.log 核心日志分析原因："
            cat xray.log
            exit 1
          fi
     
      - name: 🐍 安装 Python 依赖
        run: |
          pip install requests[socks]
          
      - name: 🚀 运行脚本
        env:
          PYTHONIOENCODING: utf-8
          ATEEX_ACCOUNT: ${{ secrets.ATEEX_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          CRON_JOB: ${{ secrets.CRON_JOB }}
          VLESS_CONFIG: ${{ secrets.VLESS_CONFIG }}
        run: |
          python ateex_coins.py

      - name: 🗑️ 删除旧运行记录（只保留最近 3 个）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🗑️ 清理旧运行记录，只保留最近 3 个..."
          
          # 安装 GitHub CLI（如果未安装）
          which gh || (curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
            && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y)
          
          REPO="${{ github.repository }}"
          echo "当前仓库: $REPO"
          
          # 获取所有运行记录 ID（跳过最近的 3 个）
          run_ids=$(gh run list --repo "$REPO" --workflow "Ateex-Coins" --json databaseId --jq '.[].databaseId' | tail -n +4)
          
          if [ -z "$run_ids" ]; then
            echo "ℹ️ 无需清理，记录不足 3 个"
            exit 0
          fi
          
          # 删除旧的
          for id in $run_ids; do
            echo "删除运行记录: $id"
            gh run delete --repo "$REPO" $id --yes || true
          done
          
          echo "✅ 清理完成"
